<button id="chat-button" class="chat-fab" type="button" aria-haspopup="dialog" aria-controls="chat-modal" aria-label="Open contact form">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 5.94 2 10.8c0 2.77 1.44 5.24 3.7 6.86-.12.9-.53 2.24-1.55 3.6a.5.5 0 0 0 .58.77c1.9-.62 3.42-1.5 4.4-2.2.9.24 1.86.37 2.87.37 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/></svg>

<div id="chat-modal" class="chat-modal" role="dialog" aria-modal="true" aria-labelledby="chat-modal-title" hidden>
  <div class="chat-modal-backdrop"></div>
  <div class="chat-modal-panel">
    <button class="chat-modal-close" type="button" aria-label="Close">&times;</button>
    <h2 id="chat-modal-title">Say hello</h2>
    <p>Send Melanie a quick note and she'll get back to you.</p>
    <form id="chat-form" class="chat-form">
      <input type="checkbox" name="botcheck" class="chat-form-honeypot" tabindex="-1" autocomplete="off">
      <div class="chat-field">
        <label for="chat-name">Name</label>
        <input type="text" id="chat-name" name="name" required>
      </div>
      <div class="chat-field">
        <label for="chat-email">Email</label>
        <input type="email" id="chat-email" name="email" required>
      </div>
      <div class="chat-field">
        <label for="chat-message">Message</label>
        <textarea id="chat-message" name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="chat-form-submit">Send Message</button>
      <p class="chat-form-status" aria-live="polite"></p>
    </form>
  </div>
</div>
